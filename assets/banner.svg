<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="AI Game Developer: plugins and skills for Claude Code and Codex. Build games in Unity, Unreal and Godot with AI.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.6" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff1a2e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff1a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ad6e0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ad6e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090c" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#07090c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#07090c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hazard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdc00"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
  </defs>

  <!-- background: dark grid with red / teal streaks (brand: AI Game Developer) -->
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <circle cx="1080" cy="120" r="320" fill="url(#glowRed)"/>
  <circle cx="820" cy="420" r="300" fill="url(#glowTeal)"/>

  <g stroke-linecap="round">
    <path d="M760 70h120" stroke="#ff1a2e" stroke-width="3" stroke-opacity="0.8"/>
    <path d="M1010 300h150" stroke="#ff1a2e" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M1180 60v90" stroke="#ff1a2e" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M700 340h90" stroke="#3ad6e0" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M960 40h70" stroke="#3ad6e0" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M1220 240v70" stroke="#3ad6e0" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M900 200h40" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
  </g>
  <g fill="#ffffff">
    <circle cx="840" cy="120" r="1.6" fill-opacity="0.5"/>
    <circle cx="1120" cy="200" r="1.4" fill-opacity="0.45"/>
    <circle cx="980" cy="260" r="1.8" fill-opacity="0.4"/>
    <circle cx="1210" cy="360" r="1.4" fill-opacity="0.4"/>
    <circle cx="760" cy="230" r="1.2" fill-opacity="0.35"/>
    <circle cx="1060" cy="350" r="1.2" fill-opacity="0.35"/>
  </g>
  <rect width="1280" height="400" rx="20" fill="url(#fadeR)"/>

  <!-- hazard stripe -->
  <g transform="translate(64 64)">
    <rect width="132" height="10" rx="2" fill="url(#hazard)"/>
  </g>

  <!-- title -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="800">
    <text x="60" y="190" font-size="128" fill="#ff1a2e" letter-spacing="-2">AI</text>
    <text x="232" y="190" font-size="128" fill="#ffffff" letter-spacing="-3">Game Dev</text>
    <text x="64" y="252" font-size="40" fill="#ffffff" fill-opacity="0.92" letter-spacing="-0.5">Plugins &amp; Skills for Claude Code and Codex</text>
  </g>

  <!-- engines -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="22">
    <g transform="translate(64 296)">
      <rect width="118" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="24" cy="22" r="6" fill="#ffffff"/>
      <text x="40" y="30" fill="#ffffff">Unity</text>
    </g>
    <g transform="translate(196 296)">
      <rect width="124" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="24" cy="22" r="6" fill="#3ad6e0"/>
      <text x="40" y="30" fill="#ffffff">Unreal</text>
    </g>
    <g transform="translate(334 296)">
      <rect width="120" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="24" cy="22" r="6" fill="#478cbf"/>
      <text x="40" y="30" fill="#ffffff">Godot</text>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(908 78)">
    <rect width="312" height="214" rx="14" fill="#0b0e12" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5" fill="#28c840"/>
    <path d="M0 38h312" stroke="#ffffff" stroke-opacity="0.1"/>
    <g font-family="'SF Mono','Menlo','Consolas',monospace" font-size="13.5" xml:space="preserve">
      <text x="18" y="66" fill="#ff1a2e">&gt;<tspan fill="#ffffff"> /plugin install unity@</tspan></text>
      <text x="32" y="86" fill="#ffffff">ai-game-dev-plugin</text>
      <text x="18" y="116" fill="#3ad6e0">✓ <tspan fill="#c9d1d9">project created</tspan></text>
      <text x="18" y="138" fill="#3ad6e0">✓ <tspan fill="#c9d1d9">plugin installed</tspan></text>
      <text x="18" y="160" fill="#3ad6e0">✓ <tspan fill="#c9d1d9">signed in to ai-game.dev</tspan></text>
      <text x="18" y="182" fill="#3ad6e0">✓ <tspan fill="#c9d1d9">editor connected</tspan></text>
      <rect x="18" y="194" width="8" height="14" fill="#ffffff" fill-opacity="0.8"/>
    </g>
  </g>

  <text x="1216" y="364" text-anchor="end" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="22" fill="#ffffff" fill-opacity="0.7">ai-game.dev</text>
</svg>
