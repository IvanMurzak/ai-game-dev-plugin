<text x="460.0" y="27" text-anchor="middle" class="t">AI Game Dev plugin · Claude Code / Codex</text>
<path d="M1 44H919" stroke="#30363d"/>
<text x="28" y="78" class="l l0"><tspan class="p">› </tspan><tspan class="u">Make a new Unity game and connect it to ai-game.dev</tspan></text>
<text x="28" y="104" class="l l1"><tspan class="a">● </tspan><tspan class="c">Using skill unity-game-dev</tspan></text>
<text x="28" y="130" class="l l2"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest create-project ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="156" class="l l3"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest install-plugin ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="182" class="l l4"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest login</tspan></text>
<text x="28" y="208" class="l l5"><tspan class="i">    Open the link in your browser and enter the code shown</tspan></text>
<text x="28" y="234" class="l l6"><tspan class="a">  ✓ </tspan><tspan class="c">Signed in to ai-game.dev</tspan></text>
<text x="28" y="260" class="l l7"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest close ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="286" class="l l8"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest open ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="312" class="l l9"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest wait-for-ready ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="338" class="l l10"><tspan class="i">  $ </tspan><tspan class="c">npx -y unity-mcp-cli@latest setup-mcp claude-code ./MyGame</tspan><tspan class="a b">  ✓</tspan></text>
<text x="28" y="364" class="l l11"><tspan class="a">● </tspan><tspan class="c">Unity is open and connected. What should we build first?</tspan></text>
