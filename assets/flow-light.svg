<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Setup flow the skill runs: create the project, install the plugin, sign in, restart the editor, verify the connection, wire MCP tools into the agent"><title>Setup flow the skill runs: create the project, install the plugin, sign in, restart the editor, verify the connection, wire MCP tools into the agent</title><style>.bg{fill:#ffffff}.card{fill:#f6f8fa}.card2{fill:#eef2f6}.bd{stroke:#d0d7de}.tx{fill:#1f2328}.mu{fill:#59636e}.cy{fill:#08707a}.vi{fill:#7341c9}.mg{fill:#b3307a}.scy{stroke:#08707a}.svi{stroke:#7341c9}.smg{stroke:#b3307a}.smu{stroke:#59636e}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08707a"/><stop offset="0.55" stop-color="#7341c9"/><stop offset="1" stop-color="#b3307a"/></linearGradient></defs><rect class="bg" width="1200" height="250"/><rect class="card bd" x="1" y="1" width="1198" height="248" rx="18" stroke-width="1.5"/><text x="40" y="44" class="sans mu" font-size="12" font-weight="700" letter-spacing="1.5">WHAT THE SKILL RUNS</text><text x="1160" y="44" text-anchor="end" class="mono mu" font-size="13">npx -y &lt;engine-cli&gt;@latest &lt;command&gt;</text><path d="M124.2,137.0 H1075.8" fill="none" class="smu" stroke-width="1.4" stroke-dasharray="4 6" opacity=".6"/><rect x="40.0" y="72" width="168.3" height="130" rx="14" class="bg scy" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-9.00s" repeatCount="indefinite"/></rect><circle cx="124.2" cy="102" r="15" class="card2 scy" stroke-width="1.4"/><text x="124.2" y="107" text-anchor="middle" class="sans cy" font-size="14" font-weight="700">1</text><text x="124.2" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Create</text><text x="124.2" y="168" text-anchor="middle" class="mono cy" font-size="13">create-project</text><text x="124.2" y="189" text-anchor="middle" class="sans mu" font-size="12">new project</text><rect x="230.3" y="72" width="168.3" height="130" rx="14" class="bg scy" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-7.50s" repeatCount="indefinite"/></rect><circle cx="314.5" cy="102" r="15" class="card2 scy" stroke-width="1.4"/><text x="314.5" y="107" text-anchor="middle" class="sans cy" font-size="14" font-weight="700">2</text><text x="314.5" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Install</text><text x="314.5" y="168" text-anchor="middle" class="mono cy" font-size="13">install-plugin</text><text x="314.5" y="189" text-anchor="middle" class="sans mu" font-size="12">engine plugin</text><rect x="420.7" y="72" width="168.3" height="130" rx="14" class="bg svi" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-6.00s" repeatCount="indefinite"/></rect><circle cx="504.8" cy="102" r="15" class="card2 svi" stroke-width="1.4"/><text x="504.8" y="107" text-anchor="middle" class="sans vi" font-size="14" font-weight="700">3</text><text x="504.8" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Sign in</text><text x="504.8" y="168" text-anchor="middle" class="mono vi" font-size="13">login</text><text x="504.8" y="189" text-anchor="middle" class="sans mu" font-size="12">browser code, once</text><rect x="611.0" y="72" width="168.3" height="130" rx="14" class="bg svi" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-4.50s" repeatCount="indefinite"/></rect><circle cx="695.2" cy="102" r="15" class="card2 svi" stroke-width="1.4"/><text x="695.2" y="107" text-anchor="middle" class="sans vi" font-size="14" font-weight="700">4</text><text x="695.2" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Restart</text><text x="695.2" y="168" text-anchor="middle" class="mono vi" font-size="13">close + open</text><text x="695.2" y="189" text-anchor="middle" class="sans mu" font-size="12">editor reads sign-in</text><rect x="801.3" y="72" width="168.3" height="130" rx="14" class="bg smg" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-3.00s" repeatCount="indefinite"/></rect><circle cx="885.5" cy="102" r="15" class="card2 smg" stroke-width="1.4"/><text x="885.5" y="107" text-anchor="middle" class="sans mg" font-size="14" font-weight="700">5</text><text x="885.5" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Verify</text><text x="885.5" y="168" text-anchor="middle" class="mono mg" font-size="13">wait-for-ready</text><text x="885.5" y="189" text-anchor="middle" class="sans mu" font-size="12">editor connected</text><rect x="991.7" y="72" width="168.3" height="130" rx="14" class="bg smg" stroke-width="1.4" stroke-opacity=".45"><animate attributeName="stroke-opacity" values=".45;1;.45;.45" keyTimes="0;0.06;0.16;1" dur="9.0s" begin="-1.50s" repeatCount="indefinite"/></rect><circle cx="1075.8" cy="102" r="15" class="card2 smg" stroke-width="1.4"/><text x="1075.8" y="107" text-anchor="middle" class="sans mg" font-size="14" font-weight="700">6</text><text x="1075.8" y="144" text-anchor="middle" class="sans tx" font-size="17" font-weight="700">Wire MCP</text><text x="1075.8" y="168" text-anchor="middle" class="mono mg" font-size="13">setup-mcp</text><text x="1075.8" y="189" text-anchor="middle" class="sans mu" font-size="12">tools in your agent</text><text x="40" y="232" class="sans mu" font-size="13">Then the agent builds the game in your real editor: scenes, objects, scripts, tests and screenshots. Optional: setup-skills adds project skills.</text></svg>
