<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="The setup flow the skill runs: create, install, sign in, restart, verify, wire MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="450" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }

    .gl { pointer-events: none; }
    .gl-r { fill: #FF2448; opacity: 0; animation: glr 2.8s steps(1) infinite; }
    .gl-c { fill: #2EE6FF; opacity: 0; animation: glc 2.8s steps(1) infinite; }
    .gl-s { opacity: 0; animation: gls 2.8s steps(1) infinite; }
    .gl-base { animation: glb 2.8s steps(1) infinite; }
    @keyframes glr { 0% { opacity:.75; transform:translate(-2px,0) } 6% { transform:translate(-4px,1px) } 9% { transform:translate(-1px,-1px) }
      12% { opacity:.55; transform:translate(-2px,0) } 40% { opacity:.85; transform:translate(-6px,1px) } 43% { transform:translate(3px,-1px) }
      46% { opacity:.55; transform:translate(-2px,0) } 72% { opacity:.9; transform:translate(-5px,2px) } 75% { transform:translate(-1px,0) } 78% { opacity:.6; transform:translate(-2px,0) } }
    @keyframes glc { 0% { opacity:.7; transform:translate(2px,0) } 6% { transform:translate(4px,-1px) } 9% { transform:translate(1px,1px) }
      12% { opacity:.5; transform:translate(2px,0) } 40% { opacity:.85; transform:translate(6px,-1px) } 43% { transform:translate(-3px,1px) }
      46% { opacity:.5; transform:translate(2px,0) } 72% { opacity:.9; transform:translate(5px,-2px) } 75% { transform:translate(1px,0) } 78% { opacity:.55; transform:translate(2px,0) } }
    @keyframes gls { 0%,39%,47%,71%,79%,100% { opacity:0; transform:none } 40% { opacity:1; transform:translate(9px,0) } 43% { opacity:1; transform:translate(-7px,0) }
      72% { opacity:1; transform:translate(-10px,0) } 75% { opacity:1; transform:translate(6px,0) } }
    @keyframes glb { 0%,100% { transform:none } 40% { transform:translate(1px,0) } 43% { transform:translate(-1px,0) } 46% { transform:none }
      72% { transform:translate(-1px,1px) } 75% { transform:none } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="450" fill="url(#bg)"/><rect width="1200" height="450" fill="url(#hzR)"/><rect width="1200" height="450" fill="url(#hzB)"/>
    <rect width="1200" height="450" fill="url(#dots)"/>
    <path id="w4" d="M397,150.0 H421" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><path id="w5" d="M778,150.0 H802" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><path id="w6" d="M397,310.0 H421" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-1.5s" repeatCount="indefinite"><mpath href="#w6"/></animateMotion></circle><path id="w7" d="M778,310.0 H802" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-2.0s" repeatCount="indefinite"><mpath href="#w7"/></animateMotion></circle><path id="w8" d="M980.5,210 V230 H218.5 V250" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w8"/></animateMotion></circle><text x="40" y="58" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">WHAT THE SKILL RUNS</text><rect x="40" y="90" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="102" width="3" height="96" rx="1.5" fill="#FF5A73"/><text x="62" y="130" class="s" font-size="20" font-weight="700" fill="#FAFFFD">1  Create</text><text x="62" y="164" class="m" font-size="18" fill="#6FA8D0">create-project</text><text x="62" y="192" class="s" font-size="16" fill="#8AA6B8">new project, if you have none</text><rect x="421" y="90" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="421" y="102" width="3" height="96" rx="1.5" fill="#FF5A73"/><text x="443" y="130" class="s" font-size="20" font-weight="700" fill="#FAFFFD">2  Install</text><text x="443" y="164" class="m" font-size="18" fill="#6FA8D0">install-plugin</text><text x="443" y="192" class="s" font-size="16" fill="#8AA6B8">AI Game Developer plugin</text><rect x="802" y="90" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="802" y="102" width="3" height="96" rx="1.5" fill="#EAB308"/><text x="824" y="130" class="s" font-size="20" font-weight="700" fill="#FAFFFD">3  Sign in</text><text x="824" y="164" class="m" font-size="18" fill="#6FA8D0">login</text><text x="824" y="192" class="s" font-size="16" fill="#8AA6B8">browser code, once per machine</text><rect x="40" y="250" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="262" width="3" height="96" rx="1.5" fill="#EAB308"/><text x="62" y="290" class="s" font-size="20" font-weight="700" fill="#FAFFFD">4  Restart</text><text x="62" y="324" class="m" font-size="18" fill="#6FA8D0">close + open</text><text x="62" y="352" class="s" font-size="16" fill="#8AA6B8">editor picks up the sign-in</text><rect x="421" y="250" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="421" y="262" width="3" height="96" rx="1.5" fill="#22C55E"/><text x="443" y="290" class="s" font-size="20" font-weight="700" fill="#FAFFFD">5  Verify</text><text x="443" y="324" class="m" font-size="18" fill="#6FA8D0">wait-for-ready</text><text x="443" y="352" class="s" font-size="16" fill="#8AA6B8">editor ready and connected</text><rect x="802" y="250" width="357" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="802" y="262" width="3" height="96" rx="1.5" fill="#6FA8D0"/><text x="824" y="290" class="s" font-size="20" font-weight="700" fill="#FAFFFD">6  Wire MCP</text><text x="824" y="324" class="m" font-size="18" fill="#6FA8D0">setup-mcp &lt;agent-id&gt;</text><text x="824" y="352" class="s" font-size="16" fill="#8AA6B8">engine tools in your agent</text><text x="40" y="422" class="s" font-size="17" fill="#A8C2D2">Every step is <tspan class="m" fill="#FAFFFD">npx -y &lt;engine-cli&gt;@latest &lt;command&gt;</tspan>; then the agent builds the game in your editor.</text>
    <rect x="0" y="448" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="449" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
